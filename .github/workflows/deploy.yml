name: 前端自动部署
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖 & 打包
        run: |
          npm install --omit=optional
          npm run build

      # 打包完成后，使用ssh直接上传dist内文件
      - name: 上传dist到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/shopping
            rm -rf *
            cd $GITHUB_WORKSPACE/dist
            tar -czf dist.tar.gz .
            scp dist.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/shopping
            cd /var/www/shopping
            tar -xzf dist.tar.gz
            rm -f dist.tar.gz
