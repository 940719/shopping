name: 前端自动部署
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖 & 打包
        run: |
          npm install
          npm run build

      # 用ssh-action，跨平台，Windows/Linux都能用，替代scp-action
      - name: 上传dist到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/shopping
            rm -rf *
          # 把dist打包，传到服务器并解压
          script-stop: |
            tar -czf dist.tar.gz -C dist .
            scp -O dist.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/shopping
            ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd /var/www/shopping && tar -xzf dist.tar.gz && rm -f dist.tar.gz"
