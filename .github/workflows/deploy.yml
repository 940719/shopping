name: 前端自动部署
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    # 重点：换成 windows-latest 虚拟机打包！
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖 & 打包
        run: |
          npm install
          npm run build

      - name: 上传dist文件夹到阿里云服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/"
          target: "/var/www/shopping"
          overwrite: true
