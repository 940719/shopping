name: 前端自动部署
on:
  push:
    branches: [ main ] # 如果你的分支是master，改成 branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出前端代码
        uses: actions/checkout@v4

      - name: 安装 Node20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖 + 打包
        run: |
          npm install
          npm run build

      - name: 上传dist到阿里云服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/dist
            mkdir -p /var/www/dist
            cp -r ${{ github.workspace }}/dist/* /var/www/dist/
            echo "✅ 前端部署完成"
